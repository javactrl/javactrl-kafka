plugins {
  id 'java-library'
  id 'maven-publish'
  id 'org.jreleaser' version '1.17.0'
}

group = 'io.github.javactrl'
version = '1.1.1'
base {
  archivesName = 'javactrl-kafka'
}

java {
  withJavadocJar()
  withSourcesJar()
}

compileJava {
  options.release = 11
}

repositories {
  mavenCentral()
}

configurations {
  javactrl
}

dependencies {
  implementation 'io.github.javactrl:javactrl-core:1.1.1'
  javactrl 'io.github.javactrl:javactrl-core:1.1.1'
  implementation 'org.apache.kafka:kafka-streams:4.0.0'
  implementation 'org.slf4j:slf4j-api:2.0.17'
  testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
  testImplementation 'org.apache.kafka:kafka-streams-test-utils:4.0.0'
  testImplementation 'com.fasterxml.jackson.core:jackson-core:2.19.0'
  testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'
  testImplementation 'org.slf4j:slf4j-simple:2.0.17' 
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
  manifest {
    attributes 'Automatic-Module-Name': 'io.github.javactrl.kafka'
  }
}

test {
  useJUnitPlatform()
  jvmArgs "-javaagent:${configurations.javactrl.iterator().next()}"
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      artifactId = 'javactrl-kafka'
      from components.java
      pom {
        name = 'javactrl-kafka'
        description = 'Workflow As Code on Kafka'
        url = 'https://github.com/javactrl/javactrl-kafka'
        inceptionYear = '2022'
        licenses {
          license {
            name = 'The Apache License, Version 2.0'
            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
          }
        }
        developers {
          developer {
            id = 'vitalii.akimov'
            name = 'Vitalii Akimov'
            email = 'vitaliy.akimov@gmail.com'
          }
        }
        scm {
          connection = 'scm:git:git://github.com/javactrl/javactrl.git'
          developerConnection = 'scm:git:ssh://github.com:javactrl/javactrl-kafka.git'
          url = 'http://github.com/javactrl/javactrl-kafka/tree/master'
        }
      }
    }
  }
  repositories {
    maven {
      url = layout.buildDirectory.dir('staging-deploy')
    }
  }
}

javadoc {
  options.addBooleanOption('html5', true)
}

jreleaser {
  signing {
    active = 'ALWAYS'
    armored = true
  }
  gitRootSearch = true
  deploy {
    maven {
      mavenCentral {
        sonatype {
          active = 'ALWAYS'
          url = 'https://central.sonatype.com/api/v1/publisher'
          stagingRepository('build/staging-deploy')
        }
      }
    }
  }
}
